# ===================================================================
# TEST Profile
# In-memory H2 database for fast, self-contained, and isolated testing
# Ensures 'mvn test' succeeds in local and GitLab CI environments
# ===================================================================
spring.datasource.url=jdbc:h2:mem:student_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
