# ===================================================================
# PROD Environment Profile
# Used for production environments (e.g. AWS EC2, remote server)
# All sensitive variables MUST be passed via environment variables
# ===================================================================

# Database Connection (Externalized via environment variables)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:student_prod}?useSSL=true&requireSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate - in production, do not drop or wildly alter tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
