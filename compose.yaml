services:
  mysql:
    image: mysql:8.4
    container_name: student-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: student_local
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - student-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: student_local
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - student-net

volumes:
  mysql-data:
    driver: local

networks:
  student-net:
    driver: bridge
